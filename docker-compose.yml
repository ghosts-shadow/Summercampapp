# Convenience Postgres for local development.
#   docker compose up -d
# Then set in .env:
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/summercamp?schema=public"
#   DIRECT_URL="postgresql://postgres:postgres@localhost:5432/summercamp?schema=public"
services:
  db:
    image: postgres:16-alpine
    container_name: summercamp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: summercamp
    ports:
      - "5432:5432"
    volumes:
      - summercamp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  summercamp_pgdata:
